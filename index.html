<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.png" type="image/png">
    <title>caiiiou.com</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        .video-player {
            max-width: 100%;
            max-height: 100vh;
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: pointer;
        }

        /* ── Controls overlay ── */
        .controls-overlay {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
            padding: 10px;
            align-items: center;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .sound-toggle {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            width: 122px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: -0.01em;
        }

        .sound-toggle.is-muted {
            width: 148px;
        }

        .sound-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: white;
            transform: scale(1.05);
        }

        .sound-toggle:active {
            transform: scale(0.98);
        }

        .sound-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .sound-text {
            white-space: nowrap;
        }

        /* ── Volume pill ── */
        .volume-wrapper { display: flex; align-items: center; }

        .volume-pill {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            display: flex;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 52px;
            height: 50px;
            padding: 0 14px;
            cursor: pointer;
            gap: 10px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            overflow: visible;
        }

        .volume-pill:hover,
        .volume-pill:focus-within {
            width: 220px;
            border-color: white;
            background: rgba(0, 0, 0, 0.88);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.12), 0 8px 32px rgba(0,0,0,0.5);
        }

        .volume-icon-wrap {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            color: white;
            transition: transform 0.2s ease;
        }

        .volume-pill:hover .volume-icon-wrap { transform: scale(1.1); }

        .volume-svg { width: 24px; height: 24px; fill: white; }

        .volume-range {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            height: 4px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            background: linear-gradient(to right, #fff var(--vol, 50%), rgba(255,255,255,0.25) var(--vol, 50%));
            opacity: 0;
            transform: scaleX(0.7);
            transform-origin: left;
            transition: opacity 0.3s ease 0.05s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s;
            min-width: 0;
            pointer-events: none;
        }

        .volume-pill:hover .volume-range,
        .volume-pill:focus-within .volume-range {
            opacity: 1;
            transform: scaleX(1);
            pointer-events: auto;
        }

        .volume-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.3), 0 2px 8px rgba(0,0,0,0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .volume-range::-webkit-slider-thumb:hover {
            transform: scale(1.25);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.2), 0 2px 12px rgba(0,0,0,0.6);
        }

        .volume-range::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.3), 0 2px 8px rgba(0,0,0,0.5);
        }

        .volume-range::-moz-range-track {
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.25);
        }

        .volume-range::-moz-range-progress {
            height: 4px;
            border-radius: 4px;
            background: #fff;
        }

        .volume-label {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.75);
            flex-shrink: 0;
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease 0.05s, width 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.05s;
            letter-spacing: -0.02em;
            pointer-events: none;
            white-space: nowrap;
        }

        .volume-pill:hover .volume-label,
        .volume-pill:focus-within .volume-label {
            opacity: 1;
            width: 32px;
        }

        /* ── Playback overlay ── */
        .playback-toggle {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: transparent;
            color: white;
            border: none;
            padding: 0;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.28));
        }

        .video-player:hover ~ .playback-toggle {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .playback-icon {
            width: 72px;
            height: 72px;
            fill: currentColor;
            flex-shrink: 0;
            opacity: 0.55;
        }

        /* ── Drive button ── */
        .drive-button-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 20px 0;
            background: #000;
        }

        .drive-button {
            width: 100px;
            height: 100px;
            background: transparent;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .drive-button:hover {
            transform: translateY(-2px) scale(1.05);
        }

        .drive-button:active {
            transform: translateY(1px);
        }

        .drive-icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
        }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .video-container { height: 50vh; }
            .video-player    { max-height: 50vh; }
            .sound-toggle { padding: 16px 32px; font-size: 18px; min-height: 64px; gap: 12px; width: 156px; }
            .sound-toggle.is-muted { width: 194px; }
            .sound-icon { width: 36px; height: 36px; }
            .volume-pill { height: 62px; padding: 0 16px; width: 62px; }
            .volume-pill:hover, .volume-pill:focus-within { width: 250px; }
            .volume-svg { width: 30px; height: 30px; }
            .playback-icon { width: 56px; height: 56px; }
            .drive-button { width: 150px; height: 150px; border-radius: 20px; }
            .drive-icon { width: 120px; height: 120px; }
            .drive-button-container { padding: 32px 0; }
            .controls-overlay { top: 24px; }
        }
    </style>
</head>
<body>

<div class="video-container">
    <video class="video-player" id="video" autoplay muted loop playsinline>
        <source src="./t.mp4" type="video/mp4">
    </video>

    <div class="controls-overlay">
        <button class="sound-toggle" onclick="toggleSound()">
            <svg class="sound-icon" viewBox="0 0 24 24">
                <path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93l-1.41 1.41C19.1 7.79 20 9.79 20 12c0 2.21-0.9 4.21-2.34 5.66l1.41 1.41C20.88 17.26 22 14.76 22 12c0-2.76-1.12-5.26-2.93-7.07z"/>
                <path d="M15.5 8.5c.84.84 1.5 2.07 1.5 3.5 0 1.43-.66 2.66-1.5 3.5l1.41 1.41C18.13 15.7 19 13.91 19 12c0-1.91-.87-3.7-2.09-4.91L15.5 8.5z"/>
            </svg>
            <span class="sound-text">Unmute</span>
        </button>

        <div class="volume-wrapper">
            <div class="volume-pill" tabindex="0">
                <div class="volume-icon-wrap">
                    <svg class="volume-svg" viewBox="0 0 24 24">
                        <path id="volPath" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </div>
                <input
                    class="volume-range"
                    id="volRange"
                    type="range"
                    min="0" max="100" value="50"
                    aria-label="Volume"
                    style="--vol: 50%"
                >
                <span class="volume-label" id="volLabel">50%</span>
            </div>
        </div>
    </div>

    <div class="playback-toggle" id="playbackToggle" aria-hidden="true">
        <svg class="playback-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path id="playbackPath" d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
        </svg>
    </div>
</div>

<div class="drive-button-container">
    <a href="https://drive.google.com/drive/folders/1j8Uo6E7vTdCb5wiLLu1614EfVXa61MBv?usp=sharing"
       class="drive-button" target="_blank">
        <img src="./applejack.png"
             alt="Applejack" class="drive-icon">
    </a>
</div>

<script>
    const videoPlayer = document.getElementById('video');
    const container   = document.querySelector('.video-container');
    const soundToggle = document.querySelector('.sound-toggle');
    const soundText   = document.querySelector('.sound-text');
    const volRange    = document.getElementById('volRange');
    const volLabel    = document.getElementById('volLabel');
    const volPath     = document.getElementById('volPath');
    const playbackPath   = document.getElementById('playbackPath');

    /* ── SVG icon paths ── */
    const VOL_PATHS = {
        muted: "M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 4v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z",
        low:   "M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 4V5L9 9H5z",
        high:  "M3 9v6h4l5 4V5L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
    };

    const PLAYBACK_PATHS = {
        play: "M8 5v14l11-7z",
        pause: "M6 5h4v14H6zm8 0h4v14h-4z"
    };

    function updateVolIcon(val, muted) {
        if (muted || val === 0) volPath.setAttribute('d', VOL_PATHS.muted);
        else if (val < 50)     volPath.setAttribute('d', VOL_PATHS.low);
        else                   volPath.setAttribute('d', VOL_PATHS.high);
    }

    function updatePlaybackUI() {
        const paused = videoPlayer.paused;
        playbackPath.setAttribute('d', paused ? PLAYBACK_PATHS.play : PLAYBACK_PATHS.pause);
    }

    async function togglePlayback() {
        if (videoPlayer.paused) {
            try {
                await videoPlayer.play();
            } catch (error) {
                updatePlaybackUI();
            }
        } else {
            videoPlayer.pause();
        }
    }

    /* ── Central volume setter ── */
    function setVolume(val, muted) {
        videoPlayer.volume   = val / 100;
        videoPlayer.muted    = muted;
        volRange.value       = val;
        volRange.style.setProperty('--vol', val + '%');
        volLabel.textContent = val + '%';
        soundToggle.classList.toggle('is-muted', muted);
        soundToggle.setAttribute('aria-label', muted ? 'Unmute video' : 'Mute video');
        soundText.textContent = muted ? 'Unmute' : 'Mute';
        updateVolIcon(val, muted);
    }

    let lastVol = 50;

    /* ── On load: UI shows 50%, video starts muted (browser requires this for autoplay) ── */
    setVolume(50, true);
    updatePlaybackUI();

    if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: 'caiiiou.com',
            artist: '',
            album: ''
        });
    }

    /* ── Mute/Unmute button ── */
    function toggleSound() {
        if (videoPlayer.muted) {
            setVolume(lastVol, false);
        } else {
            setVolume(parseInt(volRange.value), true);
        }
    }

    /* ── Volume slider ── */
    volRange.addEventListener('input', () => {
        const val = parseInt(volRange.value, 10);
        if (val > 0) lastVol = val;
        setVolume(val, val === 0);
    });

    videoPlayer.addEventListener('click', togglePlayback);
    videoPlayer.addEventListener('play', updatePlaybackUI);
    videoPlayer.addEventListener('pause', updatePlaybackUI);

    /* ── Video sizing ── */
    function adjustVideoSize() {
        const cw = container.clientWidth, ch = container.clientHeight;
        const ar = videoPlayer.videoWidth / videoPlayer.videoHeight;
        if (cw / ch > ar) {
            videoPlayer.style.height = '100%';
            videoPlayer.style.width  = 'auto';
        } else {
            videoPlayer.style.width  = '100%';
            videoPlayer.style.height = 'auto';
        }
    }

    videoPlayer.addEventListener('loadedmetadata', adjustVideoSize);

    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(adjustVideoSize, 250);
    });
    window.addEventListener('orientationchange', () => setTimeout(adjustVideoSize, 100));

    /* ── Auto-hide controls ── */
    let hideTimeout;
    const controlsEl = document.querySelector('.controls-overlay');
    const volPill    = document.querySelector('.volume-pill');
    
    function collapseVolumePill() {
        if (volPill.contains(document.activeElement)) {
            document.activeElement.blur();
        }
    }

    function showControls() {
        controlsEl.style.opacity = '1';
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(() => {
            if (!volPill.matches(':hover') && !volPill.matches(':focus-within')) {
                controlsEl.style.opacity = '0';
            }
        }, 4000);
    }

    volPill.addEventListener('mouseenter', () => {
        clearTimeout(hideTimeout);
        controlsEl.style.opacity = '1';
    });
    volPill.addEventListener('mouseleave', () => {
        collapseVolumePill();
        showControls();
    });
    container.addEventListener('mousemove',  showControls);
    container.addEventListener('touchstart', showControls);
    showControls();
</script>
</body>
</html>
